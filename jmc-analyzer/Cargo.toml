[package]
name = "jmc-analyzer"
authors.workspace = true
description = "JustCode language data, VS Code extension builder, and a future language server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
build = "build.rs"
default-run = "jmc-analyzer"

[[bin]]
name = "jmc-analyzer"
path = "src/main.rs"

[features]
default = []
# Future: `lsp` will enable the language-server binary path used by the VS Code client.
lsp = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
jmcc = { path = "../jmcc" }
jmcdata = { path = "../jmcdata" }
line-index = "0.1"
text-size = "1.1"

[build-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints]
workspace = true
