[package]
name = "jmcmock"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Mock runtime model for compiled JMCC modules: loads the JSON emitted by `jmcc` through `jmcdata` and reports problems that only surface at runtime."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
jmcdata = { version = "0.1", path = "../jmcdata" }
litemap = "0.8"
ordered-float = { version = "5.1", features = ["serde"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
jmcc = { path = "../jmcc" }

[lints]
workspace = true
